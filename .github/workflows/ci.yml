name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check src tests

  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        env:
          HF_HUB_OFFLINE: "1"
          PYTHONIOENCODING: utf-8
          NO_COLOR: "1"
          COLUMNS: "200"
        run: pytest -q --tb=short

  smoke:
    name: CLI smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Non-interactive run with a preset and flags
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          ragadvisor version
          ragadvisor presets
          ragadvisor run --no-interactive --preset code-assistant \
            --document-path tests/fixtures/sample_docs --privacy strict \
            --format all --output ./smoke_report
          test -f smoke_report/rag_report.md
          test -f smoke_report/rag_report.html
          test -f smoke_report/rag_config.yaml
