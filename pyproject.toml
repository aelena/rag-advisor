[build-system]
requires = ["setuptools>=69.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ragadvisor"
version = "0.2.0"
description = "RAG Configuration Adviser — rule-based recommendations for building RAG systems"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Anton" },
]
keywords = ["rag", "retrieval-augmented-generation", "cli", "advisor", "embeddings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # CLI & UI
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    # Document analysis
    "langdetect>=1.0.9",
    "chardet>=5.0.0",
    "tiktoken>=0.5.0",
    "pypdf>=3.0.0",
    "python-docx>=1.0.0",
    # HuggingFace model discovery
    "huggingface-hub>=0.20.0",
    # Config & data
    "pyyaml>=6.0",
    # XML parsing (safe)
    "defusedxml>=0.7.0",
    # Report generation
    "jinja2>=3.1.0",
    # HTTP client for LLM API calls
    "httpx>=0.24.0",
]

[project.optional-dependencies]
spacy = [
    "spacy>=3.6.0",
]
eval = [
    "sentence-transformers>=2.2.0",
    "chromadb>=0.4.0",
]
eval-faiss = [
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.0",
]
eval-pgvector = [
    "sentence-transformers>=2.2.0",
    "psycopg[binary]>=3.1.0",
    "pgvector>=0.2.0",
]
eval-sqlite = [
    "sentence-transformers>=2.2.0",
    "sqlite-vec>=0.1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "ruff>=0.1.0",
]
all = [
    "ragadvisor[spacy,eval,dev]",
]

[project.scripts]
ragadvisor = "rag_adviser.cli:app"

[project.urls]
Homepage = "https://github.com/YOURUSERNAME/ragadvisor"
Repository = "https://github.com/YOURUSERNAME/ragadvisor"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_adviser = [
    "templates/*",
    "config/*.yaml",
    "research/papers/*.md",
    "presets/builtin/*.yaml",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
